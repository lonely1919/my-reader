<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Folio 阅读器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f4ef;
  --surface:#ffffff;
  --surface2:#f0ece4;
  --border:#e0d8cc;
  --text:#1a1612;
  --text2:#6b6057;
  --text3:#a09288;
  --accent:#c0392b;
  --accent2:#e74c3c;
  --sidebar:260px;
  --serif:'Noto Serif SC',Georgia,serif;
  --sans:'Noto Sans SC','PingFang SC',sans-serif;
  --radius:10px;
  --transition:0.2s ease;
}
[data-theme="dark"]{
  --bg:#161412;
  --surface:#1e1b18;
  --surface2:#252017;
  --border:#2e2a24;
  --text:#e8e0d4;
  --text2:#a09288;
  --text3:#665c54;
}
[data-theme="sepia"]{
  --bg:#f2e8d4;
  --surface:#fdf6e3;
  --surface2:#e8dcc4;
  --border:#d4c4a8;
  --text:#3b2f1e;
  --text2:#7a6248;
  --text3:#a8937a;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
button{cursor:pointer;background:none;border:none;color:inherit;font-family:inherit}

/* ── Layout ── */
.app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform var(--transition);
  z-index:100;
}
.sidebar-head{
  padding:20px 16px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.logo{
  display:flex;align-items:center;gap:8px;
  font-family:var(--serif);font-size:20px;font-weight:600;
  color:var(--text);letter-spacing:-.5px;margin-bottom:14px;
}
.logo span{color:var(--accent);font-size:22px}
.drive-area{display:flex;flex-direction:column;gap:6px}
.drive-btn{
  width:100%;padding:8px 12px;
  border:1px solid var(--border);border-radius:var(--radius);
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-family:var(--sans);
  color:var(--text2);background:var(--surface2);
  transition:all var(--transition);
}
.drive-btn:hover{border-color:var(--accent);color:var(--text)}
.drive-btn.connected{background:#e8f5e9;border-color:#81c784;color:#2e7d32}
[data-theme="dark"] .drive-btn.connected{background:#1b2e1c;border-color:#388e3c;color:#81c784}
.drive-btn svg{flex-shrink:0}
.drive-status{font-size:11px;color:var(--text3);text-align:center;padding:2px 0}
.sidebar-nav{padding:10px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.nav-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:8px;
  font-size:13.5px;color:var(--text2);
  transition:all var(--transition);cursor:pointer;
}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--surface2);color:var(--text);font-weight:500}
.nav-item svg{flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.book-list{flex:1;overflow-y:auto;padding:8px}
.book-list::-webkit-scrollbar{width:3px}
.book-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sl-label{font-size:11px;color:var(--text3);padding:8px 10px 4px;letter-spacing:.06em;text-transform:uppercase}
.sl-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:8px;
  cursor:pointer;transition:background var(--transition);
  position:relative;
}
.sl-item:hover{background:var(--surface2)}
.sl-item.active{background:var(--surface2)}
.sl-item-delete{
  display:none;
  padding:4px;color:var(--text3);opacity:0.6;
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
}
.sl-item:hover .sl-item-delete{display:block}
.sl-item-delete:hover{color:var(--accent);opacity:1}
.sl-cover{
  width:34px;height:48px;border-radius:4px;
  flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:20px;
  border:1px solid var(--border);background:var(--surface2);
}
.sl-info{flex:1;min-width:0}
.sl-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-author{font-size:11px;color:var(--text3);margin-top:1px}
.sl-prog{height:2px;background:var(--border);border-radius:1px;margin-top:5px}
.sl-prog-fill{height:100%;border-radius:1px;background:var(--accent);transition:width .3s}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:50px;background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 12px;gap:8px;flex-shrink:0;
}
.menu-btn{
  display:none;padding:6px;border-radius:8px;
  color:var(--text2);transition:all var(--transition);
}
.menu-btn:hover{background:var(--surface2);color:var(--text)}
.topbar-title{
  flex:1;font-size:14px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.topbar-actions{display:flex;align-items:center;gap:2px}
.tb-btn{
  padding:7px;border-radius:8px;
  color:var(--text2);transition:all var(--transition);
  display:flex;align-items:center;justify-content:center;
}
.tb-btn:hover{background:var(--surface2);color:var(--text)}
.tb-btn.active{color:var(--accent)}

/* ── Library View ── */
.view{flex:1;overflow:hidden;display:flex;flex-direction:column}
.library-view{overflow-y:auto;padding:24px}
.library-view::-webkit-scrollbar{width:4px}
.library-view::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.drop-zone{
  border:2px dashed var(--border);border-radius:14px;
  padding:36px 24px;text-align:center;
  cursor:pointer;transition:all var(--transition);margin-bottom:28px;
  background:var(--surface);
}
.drop-zone:hover,.drop-zone.drag-over{
  border-color:var(--accent);background:var(--surface2);
}
.drop-icon{
  width:52px;height:52px;border-radius:50%;
  background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
}
.drop-title{font-size:15px;font-weight:500;margin-bottom:6px}
.drop-sub{font-size:12.5px;color:var(--text2);margin-bottom:14px;line-height:1.6}
.drop-formats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.fmt-badge{
  font-size:11px;padding:3px 8px;border-radius:20px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);font-weight:500;letter-spacing:.03em;
}
.section-hd{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.section-title{font-size:16px;font-weight:600;font-family:var(--serif)}
.section-count{font-size:12px;color:var(--text3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-bottom:32px}
.book-tile{
  cursor:pointer;border-radius:10px;overflow:hidden;
  background:var(--surface);border:1px solid var(--border);
  transition:all var(--transition);
  position:relative;
}
.book-tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.tile-delete-btn{
  position:absolute;top:6px;right:6px;
  display:none;
  width:28px;height:28px;
  background:var(--accent);color:#fff;
  border-radius:50%;
  align-items:center;justify-content:center;
  cursor:pointer;
  z-index:10;
  font-size:16px;
}
.book-tile:hover .tile-delete-btn{display:flex}
.tile-cover{
  height:160px;display:flex;align-items:center;
  justify-content:center;font-size:46px;
  position:relative;border-bottom:1px solid var(--border);
}
.tile-badge{
  position:absolute;top:7px;right:7px;
  font-size:10px;padding:2px 6px;border-radius:10px;
  font-family:var(--sans);background:var(--accent);color:#fff;
  font-weight:500;
}
.tile-body{padding:9px 9px 11px}
.tile-title{
  font-size:12.5px;font-weight:500;margin-bottom:2px;
  overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;
}
.tile-author{font-size:11px;color:var(--text3)}
.tile-bar{height:2px;background:var(--border);border-radius:1px;margin-top:8px}
.tile-fill{height:100%;border-radius:1px;background:var(--accent)}
.empty-state{text-align:center;padding:60px 24px;color:var(--text2)}
.empty-state svg{opacity:.3;margin-bottom:12px}
.empty-state p{font-size:14px}

/* ── Reader View ── */
.reader-view{display:none;flex:1;flex-direction:column;overflow:hidden;position:relative}
.reader-view.active{display:flex}
.reader-toolbar{
  padding:8px 14px;border-bottom:1px solid var(--border);
  background:var(--surface);
  display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;flex-shrink:0;
}
.rt-group{display:flex;align-items:center;gap:4px}
.rt-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.rt-lbl{font-size:11px;color:var(--text3);min-width:24px;text-align:center}
.theme-btn{
  width:24px;height:24px;border-radius:50%;
  border:2px solid var(--border);cursor:pointer;
  transition:border-color var(--transition);flex-shrink:0;
}
.theme-btn:hover,.theme-btn.active{border-color:var(--accent)}
.theme-btn.t-light{background:#f7f4ef}
.theme-btn.t-dark{background:#161412}
.theme-btn.t-sepia{background:#f2e8d4}
#epubFrame{
  flex:1;border:none;background:var(--surface);
  display:none;
}
.txt-area{
  flex:1;overflow-y:auto;padding:40px 24px;
  background:var(--surface);
}
.txt-area.dual-page{
  display:flex;
  gap:20px;
  padding:20px;
}
.txt-area.dual-page::-webkit-scrollbar{display:none}
.dual-page-left,.dual-page-right{
  flex:1;
  overflow-y:auto;
  padding:20px;
  background:var(--surface);
  border-radius:8px;
}
.dual-page-left::-webkit-scrollbar,
.dual-page-right::-webkit-scrollbar{width:3px}
.dual-page-left::-webkit-scrollbar-thumb,
.dual-page-right::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.txt-area::-webkit-scrollbar{width:4px}
.txt-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.txt-content{
  max-width:660px;margin:0 auto;
  font-family:var(--serif);
  line-height:1.9;color:var(--text);
}
.txt-content p{margin-bottom:1.4em;font-size:var(--fs,17px)}
.txt-content h1,.txt-content h2{
  font-family:var(--serif);margin-bottom:1.2em;margin-top:1.8em;
  font-weight:600;color:var(--text);
}
.pdf-area{
  flex:1;overflow-y:auto;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;
  padding:16px;gap:12px;
}
.pdf-area.dual-page{
  flex-direction:row;
  align-items:flex-start;
}
.pdf-area canvas{
  max-width:100%;border:1px solid var(--border);
  border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.08);
}
.pdf-area.dual-page canvas{
  flex:1;max-height:90vh;
}
.reader-footer{
  padding:10px 16px;border-top:1px solid var(--border);
  background:var(--surface);
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  flex-wrap:wrap;
}
.prog-track{
  flex:1;height:4px;background:var(--border);border-radius:2px;
  cursor:pointer;position:relative;min-width:100px;
}
.prog-thumb{
  height:100%;border-radius:2px;background:var(--accent);
  transition:width .2s;pointer-events:none;
}
.prog-info{font-size:12px;color:var(--text3);white-space:nowrap;min-width:50px;text-align:right}
.nav-arrows{display:flex;gap:4px}
.arr-btn{
  padding:5px 10px;border-radius:7px;font-size:13px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);transition:all var(--transition);
}
.arr-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── Loading Overlay ── */
.loading-overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,.35);
  display:none;align-items:center;justify-content:center;
  z-index:500;backdrop-filter:blur(2px);
}
.loading-overlay.show{display:flex}
.loading-box{
  background:var(--surface);border-radius:14px;
  padding:32px 40px;text-align:center;
  border:1px solid var(--border);
}
.spinner{
  width:36px;height:36px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:14px;color:var(--text2)}

/* ── Toast ── */
.toast{
  position:fixed;bottom:20px;right:20px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:11px 16px;
  font-size:13px;display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
  opacity:0;transform:translateY(6px);
  transition:all .25s;pointer-events:none;z-index:999;
  max-width:300px;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.toast-dot.success{background:#4caf50}
.toast-dot.info{background:#2196f3}
.toast-dot.warn{background:#ff9800}

/* ── Overlay & Mobile ── */
.mob-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.45);z-index:90;
}
@media(max-width:640px){
  :root{--sidebar:280px}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .mob-overlay.show{display:block}
  .menu-btn{display:flex}
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
  .library-view{padding:14px}
  .txt-area{padding:20px 14px}
  .reader-toolbar{gap:5px}
  .rt-sep{margin:0 2px}
  .toast{bottom:12px;right:12px;left:12px;max-width:none}
}

/* ── File input hidden ── */
#fileInput{display:none}

/* ── Chapters Panel ── */
.chapters-panel{
  position:absolute;top:0;right:0;bottom:0;
  width:260px;background:var(--surface);
  border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform var(--transition);
  z-index:50;display:flex;flex-direction:column;
  box-shadow:-4px 0 20px rgba(0,0,0,.08);
}
.chapters-panel.open{transform:translateX(0)}
.cp-head{
  padding:14px 14px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.cp-title{font-size:14px;font-weight:500}
.cp-close{padding:5px;border-radius:6px;color:var(--text2);cursor:pointer}
.cp-close:hover{background:var(--surface2)}
.cp-list{flex:1;overflow-y:auto;padding:8px}
.cp-item{
  padding:9px 12px;border-radius:7px;cursor:pointer;
  font-size:13px;color:var(--text2);transition:all var(--transition);
  display:flex;align-items:flex-start;gap:8px;
}
.cp-item:hover{background:var(--surface2);color:var(--text)}
.cp-item.active{background:var(--surface2);color:var(--text);font-weight:500}
.cp-num{font-size:11px;color:var(--text3);min-width:20px;padding-top:1px}

/* ── Search in book ── */
.search-bar{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-bottom:1px solid var(--border);
  background:var(--surface);flex-shrink:0;
}
.search-bar input{
  flex:1;border:1px solid var(--border);border-radius:8px;
  padding:7px 12px;font-size:13px;
  background:var(--surface2);color:var(--text);
  font-family:var(--sans);outline:none;transition:border-color var(--transition);
}
.search-bar input:focus{border-color:var(--accent)}
.search-bar input::placeholder{color:var(--text3)}

/* ── Modal Dialog ── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.5);z-index:1000;
  align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal-box{
  background:var(--surface);border-radius:12px;
  padding:24px;border:1px solid var(--border);
  max-width:360px;text-align:center;
}
.modal-title{font-size:16px;font-weight:600;margin-bottom:12px}
.modal-text{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.6}
.modal-buttons{display:flex;gap:10px}
.modal-btn{
  flex:1;padding:10px;border-radius:8px;
  border:1px solid var(--border);font-size:13px;
  transition:all var(--transition);cursor:pointer;
}
.modal-btn.primary{
  background:var(--accent);color:#fff;border-color:var(--accent);
}
.modal-btn.primary:hover{opacity:0.9}
.modal-btn:hover{background:var(--surface2)}
</style>
</head>
<body>

<div class="mob-overlay" id="mobOverlay" onclick="closeSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo"><span>F</span>olio</div>
      <div class="drive-area">
        <button class="drive-btn" id="driveBtn" onclick="handleDriveAuth()">
          <svg width="18" height="18" viewBox="0 0 87.3 78" xmlns="http://www.w3.org/2000/svg">
            <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
            <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/>
            <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
            <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
            <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
            <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 27h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
          </svg>
          <span id="driveBtnTxt">连接 Google Drive</span>
        </button>
        <div class="drive-status" id="driveStatus"></div>
      </div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-item active" id="navAll" onclick="setNav('all')">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
        <span>所有格式</span>
      </div>
      <div class="nav-item" id="navEpub" onclick="setNav('epub')">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 3h16c1.1 0 2 .9 2 2v14c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2z"/></svg>
        <span>EPUB</span>
      </div>
      <div class="nav-item" id="navPdf" onclick="setNav('pdf')">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h8M8 14h5"/></svg>
        <span>PDF</span>
      </div>
      <div class="nav-item" id="navTxt" onclick="setNav('txt')">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M7 8h10M7 12h10M7 16h7"/></svg>
        <span>文本</span>
      </div>
    </div>

    <div class="book-list" id="bookList"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">Folio 阅读器</div>
      <div class="topbar-actions">
        <button class="tb-btn" id="dualPageBtn" onclick="toggleDualPage()" title="双页阅读">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="18"/><rect x="13" y="3" width="8" height="18"/></svg>
        </button>
        <button class="tb-btn" id="chaptersBtn" onclick="toggleChapters()" title="目录">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg>
        </button>
        <button class="tb-btn" id="closeBtn" onclick="closeReader()">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div class="view">
      <div class="library-view" id="libraryView">
        <div class="drop-zone" id="dropZone" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
          <div class="drop-icon">📁</div>
          <div class="drop-title">拖拽放置或点击选择</div>
          <div class="drop-sub">支持 EPUB、PDF、TXT、MOBI 等多种格式</div>
          <div class="drop-formats">
            <span class="fmt-badge">EPUB</span>
            <span class="fmt-badge">PDF</span>
            <span class="fmt-badge">TXT</span>
            <span class="fmt-badge">MOBI</span>
          </div>
        </div>
        <div id="booksContainer"></div>
      </div>

      <div class="reader-view" id="readerView">
        <div class="reader-toolbar">
          <div class="rt-group">
            <span class="rt-lbl">主题</span>
            <button class="theme-btn t-light" onclick="setTheme('light')" title="浅色"></button>
            <button class="theme-btn t-dark" onclick="setTheme('dark')" title="深色"></button>
            <button class="theme-btn t-sepia" onclick="setTheme('sepia')" title="复古"></button>
          </div>
          <div class="rt-sep"></div>
          <div class="rt-group">
            <span class="rt-lbl">字号</span>
            <button class="tb-btn" id="fontSmallBtn" onclick="changeFontSize(-2)">A</button>
            <button class="tb-btn" id="fontLargeBtn" onclick="changeFontSize(2)">A+</button>
          </div>
        </div>

        <iframe id="epubFrame" style="display:none;"></iframe>
        <div class="txt-area" id="txtArea" style="display:none;"><div class="txt-content" id="txtContent"></div></div>
        <div class="pdf-area" id="pdfArea" style="display:none;"></div>

        <div class="reader-footer">
          <div style="flex:1;display:flex;align-items:center;gap:8px;min-width:0;">
            <div class="prog-track" onclick="seekProgress(event)">
              <div class="prog-thumb" id="progThumb"></div>
            </div>
            <div class="prog-info" id="progInfo">0%</div>
          </div>
          <div class="nav-arrows">
            <button class="arr-btn" id="prevBtn" onclick="prevPage()">← 上一页</button>
            <button class="arr-btn" id="nextBtn" onclick="nextPage()">下一页 →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="chapters-panel" id="chaptersPanel">
    <div class="cp-head">
      <div class="cp-title">目录</div>
      <button class="cp-close" onclick="toggleChapters()">✕</button>
    </div>
    <div class="cp-list" id="chaptersList"></div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-txt" id="loadingTxt">正在加载...</div>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-dot success"></div>
  <span id="toastTxt"></span>
</div>

<input type="file" id="fileInput" multiple accept=".epub,.pdf,.txt,.mobi" onchange="handleFileSelect(event)">

<script>
// ==================== 全局变量 ====================
let currentBook = null;
let currentFileType = null;
let currentTheme = 'light';
let currentFontSize = 17;
let dualPageMode = false;
let currentPage = 0;
let totalPages = 0;
let books = [];
let currentNav = 'all';
let pdfDoc = null;
let pdfCurrentPage = 1;

const state = {
  books: JSON.parse(localStorage.getItem('folio_books') || '[]'),
  theme: localStorage.getItem('folio_theme') || 'light',
  fontSize: parseInt(localStorage.getItem('folio_fontSize')) || 17,
};

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
  currentTheme = state.theme;
  currentFontSize = state.fontSize;
  setTheme(currentTheme);
  loadBooksFromStorage();
  setupDropZone();
  document.getElementById('dropZone').onclick = () => document.getElementById('fileInput').click();
  
  console.log('✅ Folio 阅读器已初始化');
});

// ==================== 主题系统 ====================
function setTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('folio_theme', theme);
  document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.theme-btn.t-${theme}`).classList.add('active');
}

function changeFontSize(delta) {
  currentFontSize = Math.max(12, Math.min(32, currentFontSize + delta));
  localStorage.setItem('folio_fontSize', currentFontSize);
  document.documentElement.style.setProperty('--fs', currentFontSize + 'px');
}

// ==================== 文件处理 ====================
function handleDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('dropZone').classList.remove('drag-over');
  
  const files = e.dataTransfer.files;
  processFiles(files);
}

function handleDragOver(e) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('dropZone').classList.add('drag-over');
}

function handleDragLeave(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('drag-over');
}

function handleFileSelect(e) {
  const files = e.target.files;
  processFiles(files);
  e.target.value = '';
}

async function processFiles(files) {
  for (let file of files) {
    try {
      showLoading(true, `正在处理 ${file.name}...`);
      await addBook(file);
    } catch (err) {
      console.error('❌ 处理文件失败:', err);
      showToast(`❌ 处理失败: ${file.name}`, 'warn');
    }
  }
  showLoading(false);
  loadBooksFromStorage();
}

async function addBook(file) {
  const reader = new FileReader();
  
  return new Promise((resolve, reject) => {
    reader.onload = async (e) => {
      try {
        const arrayBuffer = e.target.result;
        const ext = file.name.split('.').pop().toLowerCase();
        
        let book = {
          id: Date.now() + Math.random(),
          name: file.name.replace(/\.[^.]+$/, ''),
          type: getFileType(ext),
          size: file.size,
          addedTime: new Date().toLocaleDateString('zh-CN'),
          progress: 0,
          data: arrayBuffer
        };
        
        state.books.push(book);
        localStorage.setItem('folio_books', JSON.stringify(state.books));
        showToast(`✅ 已添加: ${book.name}`, 'success');
        resolve();
      } catch (err) {
        reject(err);
      }
    };
    
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsArrayBuffer(file);
  });
}

function getFileType(ext) {
  const map = {
    'epub': 'epub',
    'pdf': 'pdf',
    'txt': 'txt',
    'mobi': 'mobi'
  };
  return map[ext] || 'unknown';
}

// ==================== 书籍管理 ====================
function loadBooksFromStorage() {
  state.books = JSON.parse(localStorage.getItem('folio_books') || '[]');
  renderBooks();
}

function renderBooks() {
  const container = document.getElementById('booksContainer');
  container.innerHTML = '';
  
  const filtered = state.books.filter(b => currentNav === 'all' || b.type === currentNav);
  
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>还没有书籍，请添加一些</p></div>';
    return;
  }
  
  const sections = {
    'epub': { title: 'EPUB 书籍', books: [] },
    'pdf': { title: 'PDF 文档', books: [] },
    'txt': { title: '文本文件', books: [] },
    'mobi': { title: 'MOBI 书籍', books: [] }
  };
  
  filtered.forEach(book => {
    if (sections[book.type]) {
      sections[book.type].books.push(book);
    }
  });
  
  Object.keys(sections).forEach(type => {
    if (sections[type].books.length > 0) {
      container.innerHTML += `
        <div class="section-hd">
          <span class="section-title">${sections[type].title}</span>
          <span class="section-count">${sections[type].books.length}</span>
        </div>
        <div class="grid">
          ${sections[type].books.map(book => `
            <div class="book-tile" onclick="openBook(${book.id})">
              <div class="tile-cover">${getIcon(book.type)}</div>
              <div class="tile-delete-btn" onclick="deleteBook(event, ${book.id})">×</div>
              <div class="tile-body">
                <div class="tile-title">${book.name}</div>
                <div class="tile-author">${book.addedTime}</div>
                <div class="tile-bar">
                  <div class="tile-fill" style="width:${book.progress || 0}%"></div>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }
  });
}

function getIcon(type) {
  const icons = { 'epub': '📚', 'pdf': '📄', 'txt': '📝', 'mobi': '📖' };
  return icons[type] || '📕';
}

function deleteBook(e, id) {
  e.stopPropagation();
  if (confirm('确定要删除这本书吗？')) {
    state.books = state.books.filter(b => b.id !== id);
    localStorage.setItem('folio_books', JSON.stringify(state.books));
    loadBooksFromStorage();
    showToast('✅ 已删除', 'success');
  }
}

function setNav(type) {
  currentNav = type;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`nav${type.charAt(0).toUpperCase() + type.slice(1)}`).classList.add('active');
  renderBooks();
}

// ==================== 阅读器 ====================
async function openBook(id) {
  const book = state.books.find(b => b.id === id);
  if (!book) return;
  
  showLoading(true, `正在打开 ${book.name}...`);
  
  try {
    currentBook = book;
    currentFileType = book.type;
    document.getElementById('topbarTitle').textContent = book.name;
    document.getElementById('libraryView').style.display = 'none';
    document.getElementById('readerView').classList.add('active');
    
    switch (book.type) {
      case 'epub':
        await openEpub(book);
        break;
      case 'pdf':
        await openPdf(book);
        break;
      case 'txt':
      case 'mobi':
        await openText(book);
        break;
    }
    
    showToast(`✅ 已打开: ${book.name}`, 'success');
  } catch (err) {
    console.error('❌ 打开书籍失败:', err);
    showToast(`❌ 打开失败: ${err.message}`, 'warn');
    closeReader();
  }
  
  showLoading(false);
}

// ---- EPUB 阅读器 ----
async function openEpub(book) {
  const container = document.getElementById('pdfArea');
  container.innerHTML = '';
  container.style.display = 'none';
  
  const txtArea = document.getElementById('txtArea');
  txtArea.style.display = 'none';
  
  const epubFrame = document.getElementById('epubFrame');
  epubFrame.style.display = 'flex';
  
  try {
    const book_obj = ePub(book.data);
    await book_obj.ready;
    
    const rendition = book_obj.renderTo(epubFrame, {
      width: '100%',
      height: '100%',
      flow: 'paginated'
    });
    
    await rendition.display();
    
    rendition.on('relocated', (location) => {
      updateProgress(book);
    });
    
    rendition.on('keyup', (e) => {
      if (e.keyCode === 37) prevPage();
      if (e.keyCode === 39) nextPage();
    });
    
    window.currentRendition = rendition;
    window.currentEpubBook = book_obj;
  } catch (err) {
    throw new Error(`EPUB加载失败: ${err.message}`);
  }
}

// ---- PDF 阅读器 ----
async function openPdf(book) {
  const container = document.getElementById('pdfArea');
  container.innerHTML = '';
  container.style.display = 'flex';
  
  document.getElementById('epubFrame').style.display = 'none';
  document.getElementById('txtArea').style.display = 'none';
  
  try {
    pdfDoc = await pdfjsLib.getDocument({ data: book.data }).promise;
    totalPages = pdfDoc.numPages;
    pdfCurrentPage = 1;
    
    window.pdfDoc = pdfDoc;
    window.pdfContainer = container;
    
    renderPdfPage(1);
    updateProgress(book);
  } catch (err) {
    throw new Error(`PDF加载失败: ${err.message}`);
  }
}

async function renderPdfPage(num) {
  if (!pdfDoc) return;
  
  try {
    const page = await pdfDoc.getPage(num);
    const scale = 1.5;
    const viewport = page.getViewport({ scale });
    
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    
    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;
    
    const container = window.pdfContainer;
    if (dualPageMode && num < totalPages) {
      canvas.style.flex = '1';
      container.innerHTML = '';
      container.appendChild(canvas);
      
      // 渲染下一页
      const page2 = await pdfDoc.getPage(num + 1);
      const viewport2 = page2.getViewport({ scale });
      const canvas2 = document.createElement('canvas');
      const context2 = canvas2.getContext('2d');
      canvas2.width = viewport2.width;
      canvas2.height = viewport2.height;
      
      await page2.render({
        canvasContext: context2,
        viewport: viewport2
      }).promise;
      
      canvas2.style.flex = '1';
      container.appendChild(canvas2);
    } else {
      container.innerHTML = '';
      container.appendChild(canvas);
    }
  } catch (err) {
    console.error('❌ PDF 页面渲染失败:', err);
  }
}

// ---- 文本阅读器 ----
async function openText(book) {
  const container = document.getElementById('pdfArea');
  container.innerHTML = '';
  container.style.display = 'none';
  
  document.getElementById('epubFrame').style.display = 'none';
  const txtArea = document.getElementById('txtArea');
  txtArea.style.display = 'flex';
  
  try {
    let text = await decodeFileText(book.data);
    
    if (dualPageMode) {
      const mid = Math.floor(text.length / 2);
      const half1 = text.substring(0, mid);
      const half2 = text.substring(mid);
      
      txtArea.innerHTML = `
        <div class="dual-page-left"><div class="txt-content">${escapeHtml(half1)}</div></div>
        <div class="dual-page-right"><div class="txt-content">${escapeHtml(half2)}</div></div>
      `;
    } else {
      document.getElementById('txtContent').textContent = text;
    }
    
    totalPages = 1;
    updateProgress(book);
  } catch (err) {
    throw new Error(`文本加载失败: ${err.message}`);
  }
}

function decodeFileText(arrayBuffer) {
  return new Promise((resolve, reject) => {
    try {
      // 尝试 UTF-8
      const uint8 = new Uint8Array(arrayBuffer);
      const text = new TextDecoder('utf-8', { fatal: true }).decode(uint8);
      resolve(text);
    } catch (e1) {
      try {
        // 尝试 GBK / GB2312
        const uint8 = new Uint8Array(arrayBuffer);
        let text = '';
        for (let i = 0; i < uint8.length; i++) {
          text += String.fromCharCode(uint8[i]);
        }
        // 简单的 Latin1 解码
        resolve(decodeURIComponent(escape(text)));
      } catch (e2) {
        reject(new Error('文本编码无法识别'));
      }
    }
  });
}

function escapeHtml(text) {
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, m => map[m]).replace(/\n/g, '<br>');
}

// ==================== 导航控制 ====================
function prevPage() {
  if (currentFileType === 'pdf') {
    pdfCurrentPage = Math.max(1, pdfCurrentPage - (dualPageMode ? 2 : 1));
    renderPdfPage(pdfCurrentPage);
  } else if (window.currentRendition) {
    window.currentRendition.prev();
  }
}

function nextPage() {
  if (currentFileType === 'pdf') {
    pdfCurrentPage = Math.min(totalPages, pdfCurrentPage + (dualPageMode ? 2 : 1));
    renderPdfPage(pdfCurrentPage);
  } else if (window.currentRendition) {
    window.currentRendition.next();
  }
}

function toggleDualPage() {
  dualPageMode = !dualPageMode;
  document.getElementById('dualPageBtn').classList.toggle('active');
  
  if (currentFileType === 'pdf' && pdfDoc) {
    renderPdfPage(pdfCurrentPage);
  } else if (currentFileType === 'txt' || currentFileType === 'mobi') {
    const txtArea = document.getElementById('txtArea');
    const content = document.getElementById('txtContent').textContent;
    
    if (dualPageMode) {
      const mid = Math.floor(content.length / 2);
      const half1 = content.substring(0, mid);
      const half2 = content.substring(mid);
      
      txtArea.classList.add('dual-page');
      txtArea.innerHTML = `
        <div class="dual-page-left"><div class="txt-content">${escapeHtml(half1)}</div></div>
        <div class="dual-page-right"><div class="txt-content">${escapeHtml(half2)}</div></div>
      `;
    } else {
      txtArea.classList.remove('dual-page');
      txtArea.innerHTML = `<div class="txt-content">${escapeHtml(content)}</div>`;
    }
  }
  
  showToast(dualPageMode ? '✅ 已启用双页模式' : '✅ 已关闭双页模式');
}

function seekProgress(e) {
  if (!currentBook) return;
  
  const track = e.currentTarget;
  const rect = track.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  
  if (currentFileType === 'pdf') {
    pdfCurrentPage = Math.max(1, Math.min(totalPages, Math.floor(totalPages * percent)));
    renderPdfPage(pdfCurrentPage);
  } else if (window.currentRendition) {
    const fraction = window.currentRendition.book.spine.length * percent;
    window.currentRendition.display(fraction);
  }
}

function updateProgress(book) {
  if (!currentBook || !book || book.id !== currentBook.id) return;
  
  let progress = 0;
  
  if (currentFileType === 'pdf') {
    progress = Math.round((pdfCurrentPage / totalPages) * 100);
  } else if (window.currentRendition) {
    const current = window.currentRendition.currentLocation();
    progress = Math.round((current.progress || 0) * 100);
  }
  
  book.progress = Math.max(book.progress || 0, progress);
  localStorage.setItem('folio_books', JSON.stringify(state.books));
  
  document.getElementById('progThumb').style.width = progress + '%';
  document.getElementById('progInfo').textContent = progress + '%';
}

function closeReader() {
  document.getElementById('readerView').classList.remove('active');
  document.getElementById('libraryView').style.display = 'block';
  document.getElementById('epubFrame').style.display = 'none';
  document.getElementById('txtArea').style.display = 'none';
  document.getElementById('pdfArea').style.display = 'none';
  
  if (window.currentRendition) {
    window.currentRendition.destroy();
  }
  
  currentBook = null;
  pdfDoc = null;
  dualPageMode = false;
  document.getElementById('dualPageBtn').classList.remove('active');
}

function toggleChapters() {
  document.getElementById('chaptersPanel').classList.toggle('open');
}

// ==================== UI 工具 ====================
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mobOverlay').classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobOverlay').classList.remove('show');
}

function showLoading(show, text = '加载中...') {
  const overlay = document.getElementById('loadingOverlay');
  const txt = document.getElementById('loadingTxt');
  
  if (show) {
    txt.textContent = text;
    overlay.classList.add('show');
  } else {
    overlay.classList.remove('show');
  }
}

function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  const dot = toast.querySelector('.toast-dot');
  const txt = document.getElementById('toastTxt');
  
  dot.className = 'toast-dot ' + type;
  txt.textContent = message;
  toast.classList.add('show');
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}

function handleDriveAuth() {
  showToast('💡 Google Drive 集成功能即将上线', 'info');
}

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('readerView').classList.contains('active')) return;
  
  if (e.key === 'ArrowLeft') prevPage();
  if (e.key === 'ArrowRight') nextPage();
  if (e.key === 'Escape') closeReader();
  if (e.key === 'r' && e.ctrlKey) location.reload();
});

console.log('✅ 所有功能已加载完成');
</script>
</body>
